<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Golden Hexagon Glow -->
    <linearGradient id="goldHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>

    <!-- Bee Body Gradient -->
    <linearGradient id="beeYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="30%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Bee Dark Stripe Gradient -->
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Bee Wing Gradient -->
    <linearGradient id="wingGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#7DD3FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="wingGradRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#7DD3FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.98" />
    </linearGradient>

    <!-- Honeycomb Pattern Stroke -->
    <linearGradient id="honeycombGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0.05" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="wingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. Background Rounded Squircle (App Icon Base) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 2. Decorative Honeycomb Pattern in Background -->
  <g stroke="url(#honeycombGlow)" stroke-width="3" fill="none">
    <!-- Top-left honeycomb -->
    <polygon points="120,60 160,83 160,129 120,152 80,129 80,83" />
    <!-- Top-right honeycomb -->
    <polygon points="392,60 432,83 432,129 392,152 352,129 352,83" />
    <!-- Bottom-left honeycomb -->
    <polygon points="100,380 140,403 140,449 100,472 60,449 60,403" />
    <!-- Bottom-right honeycomb -->
    <polygon points="412,380 452,403 452,449 412,472 372,449 372,403" />
  </g>

  <!-- 3. Central Golden Badge (Hexagonal Shield) -->
  <polygon 
    points="256,40 430,135 430,377 256,472 82,377 82,135" 
    fill="#131D31" 
    stroke="url(#goldHexGrad)" 
    stroke-width="12" 
    stroke-linejoin="round"
    filter="url(#shadowFilter)" 
  />

  <!-- Inner Soft Golden Ring -->
  <polygon 
    points="256,58 412,146 412,366 256,454 100,366 100,146" 
    fill="none" 
    stroke="#FFCA28" 
    stroke-width="2" 
    stroke-opacity="0.3"
    stroke-linejoin="round"
  />

  <!-- 4. Cute Bee Character -->
  <g id="beeMascot" filter="url(#shadowFilter)">

    <!-- Antennae -->
    <!-- Left Antenna -->
    <path d="M 226,170 C 205,125 170,115 155,130 C 144,142 155,160 170,154" 
          fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round" />
    <circle cx="152" cy="132" r="14" fill="#FFCA28" stroke="#FFE082" stroke-width="3" filter="url(#glowFilter)" />

    <!-- Right Antenna -->
    <path d="M 286,170 C 307,125 342,115 357,130 C 368,142 357,160 342,154" 
          fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round" />
    <circle cx="360" cy="132" r="14" fill="#FFCA28" stroke="#FFE082" stroke-width="3" filter="url(#glowFilter)" />

    <!-- Left Wing (Glossy & Angled) -->
    <g filter="url(#wingGlow)">
      <ellipse cx="185" cy="210" rx="65" ry="42" transform="rotate(-38 185 210)" fill="url(#wingGradLeft)" />
      <!-- Wing Inner Veins -->
      <path d="M 185,210 Q 155,190 140,185 M 185,210 Q 165,220 150,230" 
            stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" fill="none" />
      <ellipse cx="178" cy="198" rx="45" ry="12" transform="rotate(-38 178 198)" fill="#FFFFFF" fill-opacity="0.5" />
    </g>

    <!-- Right Wing (Glossy & Angled) -->
    <g filter="url(#wingGlow)">
      <ellipse cx="327" cy="210" rx="65" ry="42" transform="rotate(38 327 210)" fill="url(#wingGradRight)" />
      <!-- Wing Inner Veins -->
      <path d="M 327,210 Q 357,190 372,185 M 327,210 Q 347,220 362,230" 
            stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" fill="none" />
      <ellipse cx="334" cy="198" rx="45" ry="12" transform="rotate(38 334 198)" fill="#FFFFFF" fill-opacity="0.5" />
    </g>

    <!-- Bee Main Chubby Body (Golden Base) -->
    <ellipse cx="256" cy="290" rx="100" ry="118" fill="url(#beeYellowGrad)" />

    <!-- Stinger at Bottom -->
    <path d="M 244,402 Q 256,432 256,436 Q 256,432 268,402 Z" fill="#0F172A" />

    <!-- Black/Slate Stripes on Body (Curved for 3D fullness) -->
    <path d="M 166,252 Q 256,275 346,252 Q 349,276 345,292 Q 256,316 167,292 Z" fill="url(#stripeGrad)" />
    <path d="M 174,324 Q 256,350 338,324 Q 332,348 320,366 Q 256,394 192,366 Z" fill="url(#stripeGrad)" />

    <!-- Cute Honey Drop / Shield Emblem on Chest Stripe -->
    <path d="M 256,268 C 250,278 244,286 244,293 C 244,300 249,305 256,305 C 263,305 268,300 268,293 C 268,286 262,278 256,268 Z" 
          fill="#FFD54F" filter="url(#glowFilter)" />

    <!-- Blushing Pink Cheeks -->
    <ellipse cx="196" cy="225" rx="14" ry="9" fill="#FF8A80" fill-opacity="0.75" />
    <ellipse cx="316" cy="225" rx="14" ry="9" fill="#FF8A80" fill-opacity="0.75" />

    <!-- Big Kawaii Shiny Eyes -->
    <!-- Left Eye -->
    <g>
      <ellipse cx="218" cy="205" rx="17" ry="22" fill="#0F172A" />
      <!-- Big Sparkle Highlight -->
      <circle cx="212" cy="196" r="7" fill="#FFFFFF" />
      <!-- Small Sparkle Highlight -->
      <circle cx="224" cy="216" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Right Eye -->
    <g>
      <ellipse cx="294" cy="205" rx="17" ry="22" fill="#0F172A" />
      <!-- Big Sparkle Highlight -->
      <circle cx="288" cy="196" r="7" fill="#FFFFFF" />
      <!-- Small Sparkle Highlight -->
      <circle cx="300" cy="216" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Cute Happy Smile -->
    <path d="M 242,224 Q 256,238 270,224" 
          fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
    <!-- Smile Tongue -->
    <path d="M 247,226 Q 256,236 265,226 Q 256,242 247,226 Z" fill="#FF5252" />

    <!-- Tiny Royal Protector Golden Crown -->
    <path d="M 238,154 L 244,136 L 256,146 L 268,136 L 274,154 Z" 
          fill="url(#goldHexGrad)" stroke="#FFE082" stroke-width="2" stroke-linejoin="round" />
    <circle cx="244" cy="134" r="3" fill="#FFF" />
    <circle cx="256" cy="144" r="3" fill="#FFF" />
    <circle cx="268" cy="134" r="3" fill="#FFF" />
  </g>

  <!-- 5. Golden Sparkles / Stars (Security & Achievement) -->
  <g fill="#FFD54F" filter="url(#glowFilter)">
    <!-- Top Right Sparkle -->
    <path d="M 370,105 Q 370,118 382,118 Q 370,118 370,131 Q 370,118 358,118 Q 370,118 370,105 Z" />
    <!-- Bottom Left Sparkle -->
    <path d="M 145,340 Q 145,350 154,350 Q 145,350 145,360 Q 145,350 136,350 Q 145,350 145,340 Z" />
  </g>
</svg>
